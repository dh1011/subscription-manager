name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          node -e 'if (require("./package.json").version !== process.env.RELEASE_VERSION) process.exit(1)'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and run unit tests
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: docker build --label org.opencontainers.image.version="$RELEASE_VERSION" --label org.opencontainers.image.revision="$GITHUB_SHA" -t release-check .
      - name: Verify production container
        run: |
          docker run -d --name release-check -p 127.0.0.1:3000:3000 release-check
          trap 'docker logs release-check; docker rm -f release-check' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/init >/dev/null; then break; fi
            sleep 1
          done
          BASE_URL=http://localhost:3000 npm run test:api
          docker logs release-check 2>&1 | grep -q 'Notification scheduler initialized'
      - name: Push verified architecture image
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag release-check "dh1011/subscription-manager:$RELEASE_VERSION-$ARCH"
          docker push "dh1011/subscription-manager:$RELEASE_VERSION-$ARCH"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish versioned multi-platform image
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          docker buildx imagetools create --tag "dh1011/subscription-manager:$RELEASE_VERSION" \
            "dh1011/subscription-manager:$RELEASE_VERSION-amd64" \
            "dh1011/subscription-manager:$RELEASE_VERSION-arm64"
      - name: Update latest for stable releases only
        if: ${{ !github.event.release.prerelease }}
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          docker buildx imagetools create --tag dh1011/subscription-manager:latest \
            "dh1011/subscription-manager:$RELEASE_VERSION"
